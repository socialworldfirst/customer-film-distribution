<!doctype html>
<html lang="en">
<head><!--gh-guard v1 images=yes-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Customer Film Distribution</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* research_story style layer, copied from the approved specimen (Customer story entry points, 12 Nov 2026). Reuse as is; write charts new. */
/* ===== style layer (research_story reference) ===== */
:root{
  --red:#FF0051; --violet:#6F4C99; --purple:#32006E; --dark:#13002D;
  --ink:#1F2323; --ink2:#484F56; --ink3:#74797D; --grey:#A8AEB5; --line:#DADCDD; --line2:#ECEDEE;
  --wash:#F9FAFD; --white:#FFFFFF; --font:"Poppins",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--font);color:var(--ink);background:var(--white);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1184px;margin:0 auto;padding:0 24px}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--red);z-index:40}
header.site{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line2)}
.site-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:64px}
.site-in img{height:24px;width:auto}
.site-nav{display:flex;gap:2px;font-size:13px;font-weight:500}
.site-nav a{text-decoration:none;color:var(--ink2);padding:6px 9px;border-radius:40px;white-space:nowrap}
.site-nav a .n{color:var(--ink3);margin-right:4px}
.site-nav a.active{background:var(--ink);color:var(--white)}
.site-nav a.active .n{color:var(--grey)}
.hero{background:linear-gradient(135deg,var(--purple) 0%,var(--dark) 70%);color:var(--white);padding:80px 0 72px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;bottom:-160px;width:620px;height:300px;background:linear-gradient(90deg,#FF0051,#FF882A);transform:rotate(-14deg);border-radius:300px;opacity:.9}
.hero .wrap{position:relative;z-index:1}
.eyebrow{display:inline-block;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
.hero .eyebrow{color:#FF7F7C}
.hero h1{font-weight:800;font-size:clamp(38px,5.4vw,64px);line-height:1.02;letter-spacing:-1.5px;margin:14px 0 18px;max-width:15ch}
.hero .dek{font-size:19px;line-height:1.5;color:#D7C7F8;max-width:60ch}
.answer{margin-top:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:920px}
.answer div{border-top:1px solid rgba(255,255,255,.35);padding-top:16px}
.answer b{display:block;font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1}
.answer span{display:block;font-size:14px;line-height:1.45;color:#D7C7F8;margin-top:10px}
.meta{margin-top:28px;font-size:13px;color:var(--grey)}
.chapter{padding:88px 0 24px}
.chapter + .chapter{border-top:1px solid var(--line2)}
.ch-head{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 24px;margin-bottom:32px}
.ch-num{font-size:44px;font-weight:800;line-height:1;color:var(--red);letter-spacing:-1px}
.ch-head h2{font-weight:800;font-size:clamp(28px,3.4vw,42px);line-height:1.1;letter-spacing:-1px;max-width:24ch}
.ch-head .takeaway{grid-column:2;font-size:19px;line-height:1.5;max-width:64ch;margin-top:8px}
.ch-head .takeaway b{font-weight:600}
h3{font-size:20px;font-weight:600;line-height:1.3;margin:52px 0 6px}
h3 + .lede{font-size:15px;color:var(--ink2);margin-bottom:18px;max-width:72ch}
p{max-width:70ch;margin-bottom:14px}
.fine{font-size:13px;color:var(--ink3);max-width:84ch;line-height:1.5;margin-top:16px}
.fine a{color:var(--ink3)}
strong,b{font-weight:600}
figure{margin:0}
figcaption{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45}
figcaption b{color:var(--ink)}
a.media{display:block;text-decoration:none;position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--wash)}
a.media::before{content:"Open ↗";position:absolute;right:10px;top:10px;z-index:3;font-size:12px;font-weight:600;color:#fff;background:rgba(19,0,45,.85);padding:3px 9px;border-radius:6px;opacity:0;transition:opacity .15s}
a.media:hover::before{opacity:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--white);font-size:13px;line-height:1.4;padding:8px 12px;border-radius:8px;max-width:300px;z-index:50;opacity:0;transition:opacity .12s}
.tip b{display:block;font-weight:600;margin-bottom:2px}
[data-tip]{cursor:default}
details{border-top:1px solid var(--ink);margin-top:14px}
summary{cursor:pointer;padding:16px 0;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--red);font-size:20px;line-height:1}
details[open] summary::after{content:"\2212"}
details .in{padding:0 0 22px;font-size:14px}
.tw{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;min-width:860px;font-size:13px;line-height:1.4}
table.data th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 8px 0;border-bottom:1px solid var(--line)}
table.data td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line2);vertical-align:top}
table.data td:first-child{font-weight:600;white-space:nowrap}
ul.plain{margin:8px 0 0 18px;display:grid;gap:8px;max-width:80ch}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 28px}
.links a{text-decoration:none;padding:5px 0;border-bottom:1px solid var(--line2);font-size:14px}
.links a:hover{color:var(--red)}
footer{margin-top:80px;padding:32px 0;border-top:1px solid var(--line2);font-size:13px;color:var(--ink3)}

/* ===== visuals written for this page ===== */
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--ink2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.sw.r{background:var(--red)}.sw.v{background:var(--violet)}.sw.g{background:var(--ink3)}
.sw.ring{background:none;border:2px solid var(--grey)}
.sw.sq{border-radius:3px}.sw.sq.e{background:none;border:1.5px solid var(--grey)}
.sw.dash{border-radius:0;height:2px;width:12px;background:var(--grey)}

/* overview: real screenshot tiles */
.ov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 32px;align-items:end;border-top:1px solid var(--line2);padding-top:22px}
.ov figcaption{display:grid;gap:2px;margin-top:10px}
.ov .pg{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.ov .lab{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none}
.ov .lab:hover{color:var(--red)}
.ov .pe{font-size:13px;color:var(--ink2)}
.crop.fit img{object-fit:contain;object-position:center;background:#fff}

/* unit chart */
.units{display:grid;gap:12px;border-top:1px solid var(--line2);padding-top:18px}
.urow{display:grid;grid-template-columns:110px minmax(0,1fr) 170px;gap:16px;align-items:center}
.urow .nm{font-weight:600;font-size:15px}
.urow .sq{display:flex;flex-wrap:wrap;gap:4px}
.urow .sq i{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--grey);display:block}
.urow .sq i.on{background:var(--red);border-color:var(--red)}
.urow .sq i.ind{background:var(--violet);border-color:var(--violet)}
.urow .val{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.urow .val b{color:var(--ink);font-size:16px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:8px}
.stat{border-top:1px solid var(--ink);padding-top:14px}
.stat b{display:block;font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.stat b em{font-style:normal;color:var(--red)}
.stat span{display:block;font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.45}
.stat small{display:block;font-size:12px;color:var(--ink3);margin-top:6px}
.stat small a{color:var(--ink3)}

/* galleries and annotated images */
.g2,.g3,.g4{display:grid;gap:22px;margin-top:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.crop{aspect-ratio:16/9}.crop img{width:100%;height:100%;object-fit:cover;object-position:top}
.crop.menu{aspect-ratio:2.4/1}
.ann{position:relative}
.co{position:absolute;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px #fff;transform:translate(-50%,-50%)}
.co.g{background:var(--ink)}
.callouts{list-style:none;display:grid;gap:8px;margin-top:14px;font-size:14px;color:var(--ink2)}
.callouts li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.callouts li i{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.callouts li i.g{background:var(--ink)}
.thennow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px 18px;align-items:center;margin-top:8px;border-top:1px solid var(--line2);padding-top:18px}
.thennow .yr{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.thennow .yr small{display:block;font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:4px}

/* presence matrix */
.pm{border-top:1px solid var(--line2);padding-top:10px;overflow-x:auto}
.pm table{border-collapse:collapse;min-width:720px;width:100%;font-size:14px}
.pm th{font-size:12px;font-weight:600;color:var(--ink3);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.pm th:first-child,.pm th:nth-child(2){text-align:left}
.pm td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:center;height:38px}
.pm td.peer{font-weight:600;text-align:left;width:110px}
.pm td.pos{text-align:left;color:var(--ink2);width:200px}
.pm tr.first td{border-top:1px solid var(--line)}
.st{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
.st.p{background:var(--red)}
.st.a{border:2px solid var(--grey);background:#fff}
.st.n{width:14px;height:2px;border-radius:0;background:var(--grey)}

/* charts */
.chart{position:relative;border-top:1px solid var(--line2);padding-top:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{font-family:var(--font)}
.place{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line2)}
.place > div{padding:16px 18px 18px 0}
.place > div + div{border-left:1px solid var(--line2);padding-left:18px}
.place h4{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.place ul{list-style:none;display:grid;gap:10px}
.place li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start;font-size:15px;font-weight:600}
.place li .sw{margin-top:6px}
.place li span{display:block;font-size:13px;font-weight:400;color:var(--ink3)}
.place li.plan{color:var(--red)}
.place li.plan .sw{background:none;border:2px solid var(--red)}
.hbars{display:grid;gap:8px;max-width:760px}
.hb{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;gap:14px;align-items:center;font-size:14px}
.hb .t{height:18px;position:relative}
.hb .f{position:absolute;left:0;top:0;bottom:0;background:var(--grey);border-radius:0 4px 4px 0;min-width:2px}
.hb.hi{font-weight:600}.hb.hi .f{background:var(--red)}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.hb.hi .v{color:var(--ink)}
.meters{display:grid;gap:14px;max-width:760px}
.meter{display:grid;grid-template-columns:240px minmax(0,1fr) 60px;gap:14px;align-items:center;font-size:14px}
.meter .t{height:12px;border-radius:6px;background:var(--line2);position:relative;overflow:hidden}
.meter .f{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:6px}
.meter .v{font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;height:44px;gap:2px;max-width:900px;margin-top:6px}
.seg div{display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:600;color:#fff;border-radius:3px;white-space:nowrap;overflow:hidden}
.seg .a{background:var(--purple)}.seg .b{background:var(--violet)}.seg .c{background:#D7C7F8;color:var(--ink)}
.seglab{display:flex;gap:2px;max-width:900px;font-size:13px;color:var(--ink2);margin-top:8px}
.seglab div{padding-right:10px}

/* frames (Steven, 12 Nov 2026: a frame around every item) */
.lf,.rec,.stat,.units,.pm,.chart,.place,.hbars,.meters,.segbox,.thennow figure.lf{border:1px solid var(--line)!important;border-radius:14px;background:#fff;padding:16px}
.lf{display:grid;grid-template-columns:66px minmax(0,1fr);gap:16px;align-items:start;height:100%}
.lf a.media{height:200px;display:flex;align-items:center;justify-content:center;background:var(--wash);border:0;border-radius:8px;aspect-ratio:auto!important}
.imgw{position:relative;display:block;max-width:100%;max-height:100%;line-height:0}
.lf .imgw img,.ov .imgw img{display:block;max-width:100%;max-height:200px;width:auto;height:auto;object-fit:contain}
.lf figcaption{margin-top:12px}
.ov,.g2,.g3,.g4{align-items:stretch!important}
.ov figure,.g2 figure,.g3 figure,.g4 figure{margin:0}
.rec{display:grid;gap:18px;margin-top:14px;border-top:1px solid var(--line)!important;padding:16px!important}
.rec a.media{border:0;border-radius:8px;background:var(--wash)}
.rec .imgw img{width:100%;height:auto}
.stat{border-top:1px solid var(--line)!important}
.units,.pm,.chart,.place{border-top:1px solid var(--line)!important;padding-top:16px}
.hbars,.meters{max-width:none}
.place > div{padding:4px 16px 4px 0}
.thennow{border-top:0;padding-top:0}
.thennow figure.lf{margin:0}
/* links on charts */
a.hb,a.meter,a.segbox{color:inherit;text-decoration:none;display:grid}
a.segbox{display:block}
a.hb:hover span:first-child,a.meter:hover span:first-child{color:var(--red)}
.units a{display:block}
.units a:hover i{outline:2px solid var(--ink);outline-offset:1px}
a.pl{color:var(--ink);text-decoration:none}
a.pl:hover{color:var(--red)}
a.ans{color:inherit;text-decoration:none}
a.ans:hover b{text-decoration:underline}
table.data td a{color:var(--ink);text-decoration:none}
table.data td a:hover{color:var(--red)}
.pm a{display:inline-block}
/* page position thumbnails */
a.locw{display:block;text-decoration:none;color:inherit}
a.locw:hover .loc{border-color:var(--red)}
a.locw:hover .locl{color:var(--red)}
.srcrow{display:block;margin-top:4px}
a.srcl,.rm a.srcl{font-size:12px;color:var(--red);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
a.srcl:hover{text-decoration:underline}
.lf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.locw{width:66px}
.loc{position:relative;width:66px;height:190px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.loc img{width:100%;height:100%;display:block;opacity:.5}
.loc i{position:absolute;left:-1px;right:-1px;min-height:6px;border:2px solid var(--red);background:rgba(255,0,81,.28);border-radius:2px}
.locl{display:block;font-size:11px;color:var(--ink2);margin-top:6px;line-height:1.3}
.rec{grid-template-columns:66px minmax(0,1.4fr) minmax(0,1fr)!important}
/* our pages */
.pgs{display:block;border-top:1px solid var(--ink);padding-top:26px;margin-top:56px}
.pgmap{align-self:start;position:sticky;top:84px}
.pgmap img{width:100%;height:auto}
h3.pgt{margin:0 0 18px;font-size:22px}
.pgnote{font-size:14px;color:var(--ink2);margin:-8px 0 18px}
h3.pgt a{overflow-wrap:anywhere;font-size:13px;font-weight:500;color:var(--ink3);text-decoration:none;margin-left:8px}
h3.pgt a:hover{color:var(--red)}
.rec{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;align-items:start;border-top:1px solid var(--line2);padding:18px 0 22px}
.rec:first-of-type{border-top:0;padding-top:0}
.rh{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.35}
.rn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.rt p{font-size:14px;color:var(--ink2);margin:8px 0 10px 36px}
.rm{overflow-wrap:anywhere;display:grid;gap:3px;font-size:13px;color:var(--ink3);margin-left:36px}
.rm a{color:var(--ink2)}
.pri{font-weight:700}
.pri.p-now{color:var(--red)}.pri.p-next{color:var(--violet)}.pri.p-later{color:var(--ink3)}.pri.p-keep{color:var(--ink)}
.pls{display:inline!important;font-style:normal;color:inherit;margin-right:.12em;letter-spacing:0}
.stat b em.pls{color:var(--red)}
/* moves */
ol.moves{list-style:none;counter-reset:m;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 40px;margin-top:20px}
ol.moves li{counter-increment:m;position:relative;padding:16px 0 16px 48px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
ol.moves li::before{content:counter(m,decimal-leading-zero);position:absolute;left:0;top:14px;font-weight:800;font-size:20px;color:var(--red)}
ol.moves b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
ol.moves .ow{display:block;margin-top:8px;font-size:13px;color:var(--ink3)}

@media (max-width:1100px){.site-nav{display:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.links{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .lf a.media{height:160px}.lf .imgw img{max-height:160px}.lf{grid-template-columns:56px minmax(0,1fr)}
  .rec{grid-template-columns:56px minmax(0,1fr)!important}.rec .rt{grid-column:1 / -1}.locw{width:56px}.loc{width:56px;height:160px}.rt p,.rm{margin-left:0}.rh b{min-width:0}
  .answer,.stats,.g2,.g3,.g4,ol.moves,.links,.place,.ov{grid-template-columns:1fr}
  .place > div + div{border-left:0;padding-left:0;border-top:1px solid var(--line2)}
  .ch-head{grid-template-columns:1fr}.ch-head .takeaway{grid-column:1}
  .urow{grid-template-columns:1fr;gap:6px}
  .hb{grid-template-columns:96px minmax(0,1fr) 70px;font-size:13px}
  .meter{grid-template-columns:1fr 50px}.meter .t{grid-column:1 / -1;grid-row:2}
  .thennow{grid-template-columns:1fr}
  .seg div{font-size:12px;padding:0 6px}
  .hero{padding:56px 0}.chapter{padding-top:64px}
}


/* ===== visuals written for this page ===== */
.lf.noloc{grid-template-columns:minmax(0,1fr)!important}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lf .two a.media{height:auto}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--dark)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(transparent,rgba(19,0,45,.82))}
.thumb .badge{position:absolute;left:10px;bottom:8px;z-index:1;color:#fff;font-size:12px;font-weight:600}
.duo{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;display:grid;grid-template-columns:66px minmax(0,.75fr) 18px minmax(0,1.45fr);gap:14px;align-items:start;height:100%}
.duo a.media{height:200px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--wash)}
.duo .imgw img{max-height:200px;max-width:100%;width:auto;height:auto}
.duo .arr{align-self:center;justify-self:center;color:var(--ink3);font-size:20px;margin-top:-30px}
.duo figcaption{grid-column:2 / -1;margin-top:0}
.lane{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.lane::before{content:"";width:9px;height:9px;border-radius:50%;display:inline-block}
.lane.s{color:var(--red)}.lane.s::before{background:var(--red)}
.lane.p{color:var(--violet)}.lane.p::before{background:var(--violet)}
.lane.l{color:var(--ink2)}.lane.l::before{background:var(--ink2)}
.mx{border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px 16px 4px;overflow-x:auto}
.mx table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.mx th{font-size:12px;font-weight:600;color:var(--ink3);text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.mx th:first-child,.mx th:last-child{text-align:left}
.mx td{padding:9px 6px;border-bottom:1px solid var(--line2);text-align:center}
.mx tr:last-child td{border-bottom:0}
.mx td:first-child{font-weight:600;text-align:left;width:110px}
.mx td:last-child{text-align:left;color:var(--ink2)}
.mk{display:inline-block;width:14px;height:14px;border-radius:50%}
.mk.s{background:var(--red)}.mk.p{background:var(--violet)}.mk.l{background:var(--ink2)}
.mk.n{width:12px;height:2px;border-radius:0;background:var(--line);vertical-align:middle}
.pairc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:22px}
.shapes{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-top:18px}
.shapes .fr{border:2px solid var(--ink);border-radius:4px;background:#fff}
.shapes .fr.r{border-color:var(--red)}
.shapes p{margin:10px 0 0;font-size:14px}
.kit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.kitc,.lanec{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;height:100%}
.kitc h4,.lanec h4{font-size:15px;font-weight:600;line-height:1.3}
.kitc h4 small{font-weight:500;color:var(--ink3);font-size:12px;margin-left:4px}
.kitc .frs{display:flex;align-items:flex-end;gap:6px;height:64px}
.kitc .frs i{display:block;border:2px solid var(--ink);border-radius:4px}
.kitc .frs i.r{border-color:var(--red)}.kitc .frs i.v{border-color:var(--violet)}.kitc .frs i.d{border-style:dashed}
.kitc dl,.lanec dl{font-size:13px;line-height:1.45;margin:0}
.kitc dt,.lanec dt{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.kitc dd,.lanec dd{margin:0}
.lanes2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.ap-table{margin-top:4px}
.note{font-size:13px;color:var(--ink3);max-width:84ch;line-height:1.5;margin-top:12px}
@media (max-width:1100px){.kit{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .duo{grid-template-columns:56px minmax(0,1fr)}.duo a.media,.duo figcaption{grid-column:2}.duo .arr{display:none}.duo a.media{height:160px}.duo .imgw img{max-height:160px}
  .duo .locw{grid-row:1 / span 3}
  .pairc,.lanes2,.kit{grid-template-columns:1fr}
}
</style>

:root{--gate-ink:#111;--gate-mute:#8a8a8a;--gate-line:#e5e5e5;--gate-bg:#fff}

#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;

border-radius:6px;background:var(--gate-ink);color:var(--gate-bg);cursor:pointer}
#gate-err{min-height:16px;margin-top:9px;font-size:12px;color:#c0392b}
#gate-foot{margin-top:22px;font-size:11px;color:var(--gate-mute)}
.gate-lock{position:fixed;right:12px;bottom:10px;z-index:9998;font:11px
-apple-system,BlinkMacSystemFont,sans-serif;color:#9a9a9a;cursor:pointer;
opacity:.55;text-decoration:underline}
.gate-lock:hover{opacity:1}
</style>

<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
